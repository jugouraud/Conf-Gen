# Fixed-probe flow-matching experiment matching the formal PDF setup.
[paths]
corpus = "data/prompts/confgen_prompts.parquet"
output = "data/flow_method_comparison_1000"

[model]
id = "stabilityai/stable-diffusion-3-medium-diffusers"
revision = "ea42f8cef0f178587cf766dc8129abd379c90671" # Original resolved checkpoint
device = "cuda"
dtype = "float16"
height = 512
width = 512
cpu_offload = false # A100 80GB
max_sequence_length = 256

[experiment]
seed = 1729
alpha = 0.05
guidance_scale = 7.5
probe_batch_size = 8 # Eight probes; sixteen native CFG branches per call
# For smoke tests, e.g. 100. Set to 0 for all safe-reference rows.
reference_limit = 1000
validation_limit = 1000
test_limit = 1000

[probes]
trajectories = 8 # Independent prompt-seed pairs drawn from the safe fit set
integration_steps = 32 # Euler grid; exact midpoint times are added when needed
time_points = 8

[scoring]
method = "anchor_adaptive" # euclidean | anchor_static | anchor_adaptive
bandwidth_scale = 1.0 # Fixed before evaluation; h = median safe-anchor distance

[comparison]
original_output = "data/flow_method_comparison_1000_inputs_prompt_nsfw"
toxicity_metadata = "data/cache/diffusiondb/metadata.parquet"
low_nsfw_max = 0.25
high_nsfw_min = 0.5
fresh_exclusion_splits = ["data/flow_experiment/splits"]
