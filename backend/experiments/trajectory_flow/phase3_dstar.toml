# Fixed-track d* spline flow; same architecture and decoder in all three phases.
[model]
horizon = 96
dt = 0.4
width = 256
depth = 4
context_width = 64
knots = 48

[model.track]
layout = "silverstone"
center = [0.0, 0.0]
radii = [32.0, 36.0]
left_width = 0.7
right_width = 0.7
resolution = 256

[training]
seed = 20261112
epochs = 100
batch_size = 16
learning_rate = 0.00005
weight_decay = 0.0001
grad_clip = 1.0
unconditional_probability = 0.15
validation_fraction = 0.2
patience = 35
threads = 2
device = "cpu"
focus_weight = 10
clearance_weight = 2
focus_sigma_m = 0.5
clearance_margin_m = 0.12
require_matched_triplets = false

[evaluation]
solver = "heun"
steps = 32
