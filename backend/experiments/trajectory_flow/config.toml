# Train on generated expert splits/train.jsonl (velocity_disc, xy, H=16).
# Research demonstration defaults; increase independent scenes before evaluation.
[model]
horizon = 16
dt = 0.4
width = 128
depth = 3
context_width = 64

[training]
seed = 20261112
epochs = 200
batch_size = 16
learning_rate = 0.0005
weight_decay = 0.0001
grad_clip = 1.0
unconditional_probability = 0.15
validation_fraction = 0.2
patience = 35
threads = 2
device = "cpu"

[evaluation]
solver = "heun"
steps = 32
