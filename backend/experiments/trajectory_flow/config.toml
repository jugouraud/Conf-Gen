# Train on generated expert splits/train.jsonl (velocity_disc, xy, H=96).
# Research demonstration defaults; increase independent scenes before evaluation.
[model]
horizon = 96
dt = 0.4
width = 256
depth = 4
context_width = 64
knots = 24

# Must exactly match the fixed track in expert_training.toml.
[model.track]
layout = "silverstone"
center = [0.0, 0.0]
radii = [32.0, 36.0]
left_width = 0.7
right_width = 0.7
resolution = 256

[training]
seed = 20261112
epochs = 200
batch_size = 16
learning_rate = 0.0005
weight_decay = 0.0001
grad_clip = 1.0
unconditional_probability = 0.15
validation_fraction = 0.2
patience = 35
threads = 2
device = "cpu"

[evaluation]
solver = "heun"
steps = 32
