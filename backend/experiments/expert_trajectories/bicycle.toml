# Steering-aware alternative. Omitted fields use documented config.toml defaults
# and are expanded into frozen.json before generation.
[dataset]
seed = 20261109

[vehicle]
kind = "bicycle"
footprint_radius = 0.65
wheelbase = 0.5
state_lower = [-10.0, -10.0, -100.0, 0.0, -0.5]
state_upper = [10.0, 10.0, 100.0, 1.5, 0.5]
input_lower = [-1.5, -0.8]
input_upper = [1.5, 0.8]
output = "xy_sincos"
substeps = 4

[planner]
horizon = 10
dt = 0.5
initial_guess_offsets = [0.0]
solver_timeout = 20.0

[execution]
workers = 2
threads_per_worker = 1
startup_timeout = 15.0

[[guidance]]
name = "conservative"
side = 0
speed_scale = 0.4

[[guidance]]
name = "aggressive"
side = 0
speed_scale = 1.0

[scenes]
count = 4
start_time_range = [100.0, 200.0]
map_width_range = [6.5, 7.5]
map_height_range = [4.0, 5.0]
goal_distance_range = [2.0, 2.2]
initial_y_range = [-0.15, 0.15]
obstacle_radius_range = [0.2, 0.3]
obstacle_speed_range = [-0.08, 0.08]
obstacle_count = 0
moving_fraction = 0.0
invalid_initial_fraction = 0.0
