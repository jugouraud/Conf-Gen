[project]
name = "conf-gen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.33",
    "diffusers==0.32.0",
    "huggingface-hub>=0.24,<1",
    "numpy>=2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
