[project]
name = "conf-gen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.33",
    "diffusers==0.32.0",
    "huggingface-hub>=0.24,<1",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.0",
    "pillow>=10",
    "pyarrow>=15.0",
    "requests>=2.32",
    "scikit-learn>=1.4",
    "sentencepiece>=0.2",
    "torch>=2.3",
    "transformers>=4.51,<4.52",
    "tzdata; sys_platform == 'win32'",
]

[tool.uv]
package = false
link-mode = "copy"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N801", "N802"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers -ra --import-mode=importlib"
markers = [
    "unit: controlled in-process domain behavior",
    "integration: real filesystem, serialization, or subprocess boundaries",
    "contract: persisted artifact and request/response compatibility",
    "e2e: critical application workflow with external inference replaced",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["backend/src", "backend/runtime"]

[tool.coverage.report]
show_missing = true
