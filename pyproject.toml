[project]
name = "conf-gen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.24.0",
    "nicegui>=2.23.2",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "POT>=0.9.4",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0",
    "torch>=2.14.0",
    "transformers>=4.51.0",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "diffusers",
    "torchcfm>=1.0.7",
    "torchvision>=0.29.0",
]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers" }
